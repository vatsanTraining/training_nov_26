
services:
  mysqldb:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medconnect_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_api_data:/var/lib/mysql
    networks:
      - medconnect_network

  app:
    image: vatsank/mysql_doctor_api:latest
    container_name: mysql_doctor_api
    restart: unless-stopped
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE:-medconnect_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    networks:
      - medconnect_network

volumes:
  mysql_api_data:

networks:
  medconnect_network:
