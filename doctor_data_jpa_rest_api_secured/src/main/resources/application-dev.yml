management:
  endpoints:
    web:
      exposure:
        include:
        - "*"
  info:
    env:
      enabled: true
  
info:
  app:
    name: ${spring.application.name}
    artifactId: '@project.artifactId@'
    groupId: '@project.groupId@'
    version: '@project.version@'
  java:
    version: '@java.version@'

server:
  port: 6060

spring:
  application:
    name: doctor_data_jpa_rest_api_secured
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medconnect_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org:
      springframework:
         security: warn
